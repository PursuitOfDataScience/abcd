# `base` is deliberately unset so Streamlit follows the browser's colour scheme.
# static/app.css keys off `prefers-color-scheme`, and pinning a base here would
# desync the app's palette from Streamlit's own chrome.
[theme]
# The site's own link colour (`--link-color` in the website's custom.css), matching
# the palette `sage/profiles/site.py` layers over app.css. It was #800000 — the
# maroon of the deployment this was forked from — which Streamlit paints onto the
# one control the stylesheet does not reach: the send button. A maroon arrow in a
# blue box, in the corner of a blue site.
primaryColor = "#2563eb"
font = "sans serif"

[server]
# Uploads are truncated to ~30k characters anyway; the old 200 MB default meant a
# huge PDF was read into memory before anything checked its size.
maxUploadSize = 10
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# Hides the Deploy button and hamburger, but keeps the running/stop indicator
# so a long generation can still be cancelled.
toolbarMode = "minimal"
showErrorDetails = false
