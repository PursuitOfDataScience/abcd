# `base` is deliberately unset. This app is a panel inside a website that has its
# own light/dark switch, so the scheme is not a property of the deployment: app.py
# reads the `theme` parameter the site puts on the frame URL and applies the palette
# from that. Naming a base here would pin every reader to one of the two, and the
# half of them who had thrown the site's switch the other way would get a panel that
# disagreed with the page it is docked in.
[theme]
# Streamlit paints this onto the one control the stylesheet does not reach: the send
# arrow in the corner of the composer. Nothing else in the panel takes its colour
# from here, because `sage/profiles/site.py` layers a palette of its own over
# app.css, so this is the value that keeps the arrow in the same family as the box
# around it. It is the site's own link colour (`--link-color` in the website's
# custom.css).
#
# It was #800000, the maroon of the deployment this was forked from, which put a
# maroon arrow in a blue box in the corner of a blue site.
#
# Changing this needs the app's *process* restarted, not merely rerun: Streamlit
# parses config.toml once at start-up. See the note in requirements.txt for the
# switch that forces one.
primaryColor = "#2563eb"
font = "sans serif"

[server]
# Uploads are truncated to ~30k characters anyway; the old 200 MB default meant a
# huge PDF was read into memory before anything checked its size.
maxUploadSize = 10
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# Hides the Deploy button and hamburger, but keeps the running/stop indicator
# so a long generation can still be cancelled.
toolbarMode = "minimal"
showErrorDetails = false
